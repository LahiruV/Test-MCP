name: CI

# Manual trigger only - automatic runs on pull_request/push are disabled by
# request. To re-enable, restore:
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
on:
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Fails the job if statement coverage on src/features/auth/ drops below 80%.
      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
