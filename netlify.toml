# Netlify deployment configuration.
#
# The equivalents for other hosts are noted in DEPLOYMENT.md. Whichever host is
# chosen, the two things that must be true are the SPA rewrite and the security
# headers below.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA rewrite: every unknown path serves index.html so client-side routes such
# as /dashboard survive a hard refresh or a pasted link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    # connect-src must also list the API origin once VITE_API_BASE_URL points
    # somewhere other than the site's own origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Hashed assets are immutable, so they can be cached hard.
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or a deploy leaves clients on stale asset
# hashes.
[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "no-cache"
